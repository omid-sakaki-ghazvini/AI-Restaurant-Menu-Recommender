<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}منوی هوشمند{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            min-height: 100vh;
        }
        .main-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            padding: 40px;
        }
        .brand-title {
            color: #2d6a4f;
            font-weight: 700;
        }
        .btn-primary-custom {
            background: #2d6a4f;
            border: none;
            color: white;
            padding: 12px 40px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary-custom:hover {
            background: #1b4332;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(45,106,79,0.3);
            color: white;
        }
        .menu-textarea {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            resize: none;
        }
        .menu-textarea:focus {
            border-color: #2d6a4f;
            box-shadow: 0 0 0 3px rgba(45,106,79,0.1);
            outline: none;
        }
        .suggestion-card {
            background: #f8fdfa;
            border-right: 5px solid #2d6a4f;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.3s;
        }
        .suggestion-card:hover {
            box-shadow: 0 6px 20px rgba(45,106,79,0.15);
            transform: translateX(-5px);
        }
        .confidence-badge {
            background: #2d6a4f;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
        }
        .price-tag {
            color: #d97706;
            font-weight: 700;
        }
        .example-chips .chip {
            background: white;
            border: 1px solid #d0d0d0;
            border-radius: 20px;
            padding: 6px 14px;
            margin: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-block;
        }
        .example-chips .chip:hover {
            background: #2d6a4f;
            color: white;
            border-color: #2d6a4f;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
